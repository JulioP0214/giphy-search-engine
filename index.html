<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giphy Search Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Giphy Search Engine</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Search</a>
        <a href="#">About</a>
      </nav>
    </header>

    <main>
      <section class="search-section">
        <h2>Find Your Favorite GIFs</h2>
        <p>Search for GIFs by entering a keyword below.</p>

        <form id="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search for GIFs"
            required
          />
          <button type="submit">Search</button>
        </form>
      </section>
      <section class="results-section">
        <h2>Search Results</h2>

        <div id="gif-results" class="gif-grid"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Giphy Search Engine</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
